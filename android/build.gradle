buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Pinned for react-native-inappbrowser-reborn (avoids 1.5.+ / 1.4.+ metadata fetch over HTTPS)
        androidXAnnotationVersion = "1.9.1"
        androidXBrowserVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // google-services 4.4.4 + AGP 8.12: plugin needs gradle-api on buildscript classpath (google/play-services-plugins#287)
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.android.tools.build:gradle-api:8.12.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    subproject.configurations.configureEach {
        resolutionStrategy {
            force "androidx.annotation:annotation:1.9.1"
            force "androidx.browser:browser:1.8.0"
        }
    }
}
